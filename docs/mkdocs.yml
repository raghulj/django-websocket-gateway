site_name: django-websocket-gateway
site_description: Drop-in real-time WebSocket gateway for Django
site_url: https://raghulj.github.io/django-websocket-gateway/
repo_url: https://github.com/raghulj/django-websocket-gateway
repo_name: raghulj/django-websocket-gateway

docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

markdown_extensions:
  - admonition
  - toc
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.snippets:
      base_path: ["..", "."]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [..]
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            docstring_style: google
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Architecture: architecture.md
  - Authentication: authentication.md
  - Channels: channels.md
  - Publishing: publishing.md
  - Background jobs: background-jobs.md
  - Logout & revocation: logout.md
  - JavaScript client: javascript-client.md
  - Deployment: deployment.md
  - Configuration: configuration.md
  - Threat model: threat-model.md
  - API reference:
      - Python: reference/python.md
      - Go gateway: reference/go.md

strict: true

not_in_nav: |
  plan/**
