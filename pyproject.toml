[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-websocket-gateway"
version = "0.1.0"
description = "Drop-in real-time WebSocket gateway for Django"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "Django>=4.2",
    "redis>=4.5",
]
classifiers = [
    "Framework :: Django",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.8",
    "fakeredis>=2.20",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["websocket_gateway*"]

[tool.setuptools.package-data]
websocket_gateway = [
    "static/websocket_gateway/*.js",
    "bin/.gitkeep",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"websocket_gateway/tests/*" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "websocket_gateway.tests.settings"
python_files = ["test_*.py"]
testpaths = ["websocket_gateway/tests"]
addopts = ["-ra", "--strict-markers"]
filterwarnings = ["error"]
