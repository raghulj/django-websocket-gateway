name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-binaries:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build
        working-directory: gateway
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -ldflags="-s -w" -o "../gateway-${{ matrix.os }}-${{ matrix.arch }}" .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gateway-${{ matrix.os }}-${{ matrix.arch }}
          path: gateway-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error

  checksums:
    name: Generate SHA256SUMS
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Compute SHA256SUMS
        working-directory: dist
        run: |
          ls -la
          sha256sum gateway-* > SHA256SUMS
          cat SHA256SUMS
      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: checksums
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gateway-*
            dist/SHA256SUMS
          fail_on_unmatched_files: true

  python-publish:
    name: PyPI publish
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync version from tag
        run: |
          tag="${GITHUB_REF##*/}"
          version="${tag#v}"
          echo "Building version $version"
          printf '# Synced from the v* git tag by the release workflow.\n__version__ = "%s"\n' "$version" > websocket_gateway/_version.py
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Configure PyPI Trusted Publishing for this workflow; no token needed.
          packages-dir: dist/

  docker-publish:
    name: GHCR Docker image
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract tag
        id: meta
        run: |
          tag="${GITHUB_REF##*/}"
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./gateway
          file: ./gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          provenance: true
